services:
  redis:
    image: redis:7-alpine
    container_name: api_service_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Saved-lots jobs; start with `docker compose --profile jobs up scheduler`.
  # Needs a reachable Postgres (DB_* in .env) and DEBUG=false. The sitemap job
  # also needs AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_BUCKET,
  # SITE_URL and SITEMAP_PUBLIC_BASE_URL (the api container needs the AWS/S3 ones too).
  scheduler:
    build: .
    container_name: api_service_scheduler
    command: ["python", "-m", "jobs.scheduler"]
    env_file: .env
    environment:
      DEBUG: "false"
      RUN_MIGRATIONS: "false"
    restart: unless-stopped
    profiles: ["jobs"]

volumes:
  redis_data:
